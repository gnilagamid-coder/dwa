<!doctype html><html lang="ru"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&family=Archivo+Black&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,-apple-system,sans-serif;padding:28px;display:grid;gap:26px}
.pane{padding:22px;border-radius:var(--r,0)}
.pane h3{font-family:var(--disp);font-size:12px;letter-spacing:1.2px;text-transform:uppercase;opacity:.55;margin-bottom:16px;font-weight:600}
.erd{--bg:#0a0a0a;--surface:#101010;--s2:#1a1a1a;--text:#f5f4f0;--muted:#7b7873;--accent:#fff;--accent2:#c8102e;--disp:'Oswald';--r:0px;--bw:1px}
.market{--bg:#fff;--surface:#fff;--s2:#f1f4f5;--text:#16191c;--muted:#6b7280;--accent:#007782;--accent2:#0f172a;--disp:'Inter';--r:14px;--bw:0px}
.gosha{--bg:#f2ece1;--surface:#fff;--s2:#e6ded0;--text:#101010;--muted:#6b6558;--accent:#d81e05;--accent2:#111;--disp:'Archivo Black';--r:0px;--bw:2px}
.pane{background:var(--bg);color:var(--text)}

.f{margin-bottom:14px;max-width:340px}
label{display:block;font-family:var(--disp);font-size:11px;letter-spacing:.3px;text-transform:uppercase;
  color:var(--muted);margin-bottom:6px}
input,select{width:100%;background:var(--s2);border:max(1px,var(--bw)) solid transparent;color:var(--text);
  padding:14px 13px;font-size:15px;font-family:inherit;border-radius:var(--r);outline:none}
input:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
.err input{border-color:var(--accent2)}
.msg{color:var(--accent2);font-size:11px;margin-top:5px}

</style></head><body>
<div class="pane erd"><h3>ERD — чёрный холст, белый акцент</h3>
<div class="f"><label>Имя</label><input value="Иван"></div>
<div class="f"><label>Телефон *</label><input value="+7 999 000-11-22"></div>
<div class="f err"><label>Email</label><input value="почта@"><div class="msg">Проверьте адрес</div></div>
<div class="f"><label>Доставка</label><select><option>СДЭК</option><option>Самовывоз</option></select></div>
</div>
<div class="pane market"><h3>Маркет — светлый, доверительный</h3>
<div class="f"><label>Имя</label><input value="Иван"></div>
<div class="f"><label>Телефон *</label><input value="+7 999 000-11-22"></div>
<div class="f err"><label>Email</label><input value="почта@"><div class="msg">Проверьте адрес</div></div>
<div class="f"><label>Доставка</label><select><option>СДЭК</option><option>Самовывоз</option></select></div>
</div>
<div class="pane gosha"><h3>Госпечать — конструктивизм, красный</h3>
<div class="f"><label>Имя</label><input value="Иван"></div>
<div class="f"><label>Телефон *</label><input value="+7 999 000-11-22"></div>
<div class="f err"><label>Email</label><input value="почта@"><div class="msg">Проверьте адрес</div></div>
<div class="f"><label>Доставка</label><select><option>СДЭК</option><option>Самовывоз</option></select></div>
</div>
</body></html>
