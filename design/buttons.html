<!doctype html><html lang="ru"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&family=Archivo+Black&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,-apple-system,sans-serif;padding:28px;display:grid;gap:26px}
.pane{padding:22px;border-radius:var(--r,0)}
.pane h3{font-family:var(--disp);font-size:12px;letter-spacing:1.2px;text-transform:uppercase;opacity:.55;margin-bottom:16px;font-weight:600}
.erd{--bg:#0a0a0a;--surface:#101010;--s2:#1a1a1a;--text:#f5f4f0;--muted:#7b7873;--accent:#fff;--accent2:#c8102e;--disp:'Oswald';--r:0px;--bw:1px}
.market{--bg:#fff;--surface:#fff;--s2:#f1f4f5;--text:#16191c;--muted:#6b7280;--accent:#007782;--accent2:#0f172a;--disp:'Inter';--r:14px;--bw:0px}
.gosha{--bg:#f2ece1;--surface:#fff;--s2:#e6ded0;--text:#101010;--muted:#6b6558;--accent:#d81e05;--accent2:#111;--disp:'Archivo Black';--r:0px;--bw:2px}
.pane{background:var(--bg);color:var(--text)}

.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
button{font:inherit;cursor:pointer;border:none;border-radius:var(--r);min-height:48px;padding:0 22px;
  font-family:var(--disp);font-weight:600;letter-spacing:.4px}
.primary{background:var(--accent);color:var(--bg)}
.market .primary,.gosha .primary{color:#fff}
.secondary{background:var(--s2);color:var(--text);border:var(--bw) solid var(--s2)}
.ghost{background:transparent;color:var(--muted);border:1px solid var(--muted)}
.icon{min-height:44px;width:44px;padding:0;display:inline-flex;align-items:center;justify-content:center;
  background:var(--s2);color:var(--text)}
button:disabled{opacity:.35;cursor:default}

</style></head><body>
<div class="pane erd"><h3>ERD — чёрный холст, белый акцент</h3>
<div class="row">
  <button class="primary">Оформить заказ</button>
  <button class="secondary">Написать менеджеру</button>
  <button class="ghost">Отмена</button>
  <button class="icon">♥</button>
  <button class="primary" disabled>Раскуплено</button>
</div>
</div>
<div class="pane market"><h3>Маркет — светлый, доверительный</h3>
<div class="row">
  <button class="primary">Оформить заказ</button>
  <button class="secondary">Написать менеджеру</button>
  <button class="ghost">Отмена</button>
  <button class="icon">♥</button>
  <button class="primary" disabled>Раскуплено</button>
</div>
</div>
<div class="pane gosha"><h3>Госпечать — конструктивизм, красный</h3>
<div class="row">
  <button class="primary">Оформить заказ</button>
  <button class="secondary">Написать менеджеру</button>
  <button class="ghost">Отмена</button>
  <button class="icon">♥</button>
  <button class="primary" disabled>Раскуплено</button>
</div>
</div>
</body></html>
