<!-- @dsCard group="Компоненты" -->
<!doctype html><html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&family=Archivo+Black&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
/* Системная safe area: вырезы экрана, навигационные панели */
html{
  padding-top:var(--tg-safe-area-inset-top,0px);
  padding-right:var(--tg-safe-area-inset-right,0px);
  padding-bottom:var(--tg-safe-area-inset-bottom,0px);
  padding-left:var(--tg-safe-area-inset-left,0px);
}
body{
  font-family:Inter,-apple-system,sans-serif;
  /* Content safe area: контент не перекрывается UI Telegram */
  padding-top:calc(28px + var(--tg-content-safe-area-inset-top,0px));
  padding-right:calc(28px + var(--tg-content-safe-area-inset-right,0px));
  padding-bottom:calc(28px + var(--tg-content-safe-area-inset-bottom,0px));
  padding-left:calc(28px + var(--tg-content-safe-area-inset-left,0px));
  min-height:var(--app-stable-height,auto);
  display:grid;gap:26px;align-content:start;
  background:var(--tg-theme-bg-color);
  color:var(--tg-theme-text-color);
}
.pane{padding:22px;border-radius:14px;background:var(--tg-theme-section-bg-color)}
.pane h3{font-family:'Inter';font-size:12px;letter-spacing:1.2px;text-transform:uppercase;color:var(--tg-theme-hint-color);margin-bottom:16px;font-weight:600}

.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;max-width:340px}
.card{background:var(--tg-theme-bg-color);border:1px solid var(--tg-theme-secondary-bg-color);border-radius:14px;overflow:hidden;position:relative}
.ph{aspect-ratio:4/3;background:linear-gradient(135deg,var(--tg-theme-button-color) 0%,var(--tg-theme-accent-text-color) 100%);
  display:flex;align-items:center;justify-content:center;color:var(--tg-theme-button-text-color);font-family:'Inter';font-size:40px}
.body{padding:10px 12px 12px;display:flex;justify-content:space-between;align-items:flex-end;gap:8px}
.price{font-family:'Inter';font-size:17px;font-weight:600;color:var(--tg-theme-accent-text-color);line-height:1.1}
.old{font-size:11px;color:var(--tg-theme-hint-color);text-decoration:line-through;margin-left:6px;font-weight:400}
.name{font-size:13px;color:var(--tg-theme-hint-color);margin-top:5px;line-height:1.35}
.add{width:36px;height:36px;flex:0 0 36px;background:var(--tg-theme-button-color);color:var(--tg-theme-button-text-color);border:none;border-radius:14px;
  font-size:18px;cursor:pointer;line-height:1}
.badge{position:absolute;top:10px;left:8px;background:var(--tg-theme-accent-text-color);color:var(--tg-theme-button-text-color);font-family:'Inter';
  font-size:10px;letter-spacing:.5px;text-transform:uppercase;padding:3px 10px;border-radius:99px;z-index:1}
.stock{position:absolute;bottom:0;left:0;right:0;background:var(--tg-theme-secondary-bg-color);color:var(--tg-theme-text-color);font-family:'Inter';
  font-size:10px;text-transform:uppercase;text-align:center;padding:5px 0}

</style></head><body>
<div class="pane"><h3>Карточки товаров — тема Telegram</h3>
<div class="grid">
  <div class="card">
    <div class="ph" style="position:relative"><span class="badge">TOP</span>A</div>
    <div class="body"><div><div class="price">4 500 ₽<span class="old">6 000 ₽</span></div>
      <div class="name">Плакат «Ритм»</div></div><button class="add">+</button></div>
  </div>
  <div class="card">
    <div class="ph" style="position:relative">B<span class="stock">Осталось 2</span></div>
    <div class="body"><div><div class="price">12 000 ₽</div>
      <div class="name">Серия «Сдвиг», триптих</div></div><button class="add">+</button></div>
  </div>
</div>
</div>

<script>
(function() {
  // Защита: SDK гарантированно доступен только внутри клиента Telegram
  if (!window.Telegram || !window.Telegram.WebApp) return;
  var tg = window.Telegram.WebApp;

  // Сообщаем Telegram, что приложение готово к отображению
  tg.ready();

  // Разворачиваем Mini App на максимальную высоту, если ещё не развёрнут
  if (!tg.isExpanded) {
    tg.expand();
  }

  // Тема: цвета --tg-theme-* обновляются SDK автоматически,
  // здесь лишь фиксируем текущую цветовую схему
  function applyColorScheme() {
    document.documentElement.setAttribute('data-theme', tg.colorScheme);
  }

  // Высота: для макета используется viewportStableHeight,
  // а не viewportHeight (рекомендация документации)
  function applyStableHeight() {
    document.documentElement.style.setProperty('--app-stable-height', tg.viewportStableHeight + 'px');
  }

  applyColorScheme();
  applyStableHeight();

  tg.onEvent('themeChanged', applyColorScheme);

  tg.onEvent('viewportChanged', function(data) {
    if (data.isStateStable) {
      applyStableHeight();
    }
  });
})();
</script>
</body></html>
