# Netlify-деплой этого проекта НЕ поддерживается начиная с версии 2.0.
#
# Витрина и админка из public/ работают со схемой настроек v2 (brand / theme /
# commerce / notify — см. server/settings.js), а функции в netlify/functions/
# остались от версии 1 с плоской схемой. Кроме того, на Netlify:
#   * нет половины ручек (/api/admin/stats, /orders, /reorder, /export, /inquiry);
#   * файловая система эфемерная — data/ там не живёт, нужен @netlify/blobs;
#   * бот на long polling невозможен в принципе, serverless-процесс живёт секунды.
#
# Собранный деплой выглядел бы «почти рабочим», но падал бы на первом же входе в
# админку — поэтому сборка намеренно останавливается здесь, а не молча.
#
# Актуальный способ установки — VPS: см. SETUP.md (подробно) или README.md (кратко).
# Если Netlify-версия всё-таки нужна, её надо портировать: хранилище на
# @netlify/blobs, все ручки в одну функцию-роутер, бот на вебхуке (BOT_MODE=webhook).

[build]
  publish = "public"
  command = "echo 'Netlify-деплой не поддерживается в версии 2.0 — ставьте на VPS, инструкция в SETUP.md' && exit 1"
